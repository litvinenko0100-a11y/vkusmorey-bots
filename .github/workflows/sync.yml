name: Синхронизация на сервер

on:
  push:
    branches: [main]
    paths:
      - 'bot_*.py'
      - 'prices.json'
      - 'content_queue.json'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Проверяем синтаксис ботов
        run: |
          python3 -m py_compile bot_excursions.py bot_products.py bot_content.py && echo "syntax ok"
      - name: Валидируем очередь контента
        run: |
          python3 -c "import json;d=json.load(open('content_queue.json',encoding='utf-8'));print('posts in queue:',len(d))"
