name: Ð²ÐºÑÑÑ Ð¼Ð¾ÑÐ¹ÐµÐ¹ · Ð±Ð¾ÑÑ‹

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */5 * * *'

concurrency:
  group: vkusmorey-bots
  cancel-in-progress: false

jobs:
  bots:
    runs-on: ubuntu-latest
    timeout-minutes: 290
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Health check tokens
        env:
          EXCURSIONS_TOKEN: ${{ secrets.EXCURSIONS_TOKEN }}
          PRODUCTS_TOKEN: ${{ secrets.PRODUCTS_TOKEN }}
        run: |
          echo "=== token check ==="
          for v in EXCURSIONS_TOKEN PRODUCTS_TOKEN; do
            val="${!v}"
            if [ -z "$val" ]; then
              echo "SECRET $v is EMPTY"
            else
              echo "SECRET $v is set (len=${#val})"
            fi
          done
          if [ -z "$EXCURSIONS_TOKEN" ] || [ -z "$PRODUCTS_TOKEN" ]; then
            echo "::warning::One or more secrets are empty - bots will fall back to hardcoded token and conflict on getUpdates"
          fi
      - name: Ð‘Ð¾ÑÑ‹ Ð²ÐºÑÐºÑÑÐ¾Ð¹ Ð¼Ð¾ÑÐµÐ¹ (Ð¿ÑÐ¾Ð¾Ð³ÑƒÐ»ÐºÐ¸ + Ð¼Ð¾ÑÐµÐµÐ¿ÑÐ¾Ð¾ÐºÑ‚Ñ‹)
        env:
          EXCURSIONS_TOKEN: ${{ secrets.EXCURSIONS_TOKEN }}
          PRODUCTS_TOKEN: ${{ secrets.PRODUCTS_TOKEN }}
          BOT_DIR: ${{ github.workspace }}
        run: |
          python3 bot_excursions.py &
          P1=$!
          python3 bot_products.py &
          P2=$!
          echo "bots started: $P1 $P2"
          sleep 20
          if ! kill -0 $P1 2>/dev/null; then echo "::error::bot_excursions died"; fi
          if ! kill -0 $P2 2>/dev/null; then echo "::error::bot_products died"; fi
          wait $P1 $P2
