name: Access check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests
      - name: Check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCTS_TOKEN: ${{ secrets.PRODUCTS_TOKEN }}
          EXCURSIONS_TOKEN: ${{ secrets.EXCURSIONS_TOKEN }}
        run: python3 access_check.py
