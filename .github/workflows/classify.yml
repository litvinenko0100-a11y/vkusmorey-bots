name: Classify reels

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -U yt-dlp faster-whisper
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Classify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 classify_reels.py
      - name: Commit frame sheets
        run: |
          git config user.name 'bot'
          git config user.email 'bot@local'
          git add frames || true
          git commit -m 'chore: reel frame sheets' || true
          git push || true
